name: tests

# A push or pull request that changes only prose and pictures (the README and the other
# Markdown files, docs/, llms.txt, the licence, the issue forms and the live captures) gets
# no run: nothing the mod loads or the tests read is in those files, and the run takes
# over an hour. Everything else, the workflow itself included, still runs. A push runs only
# on main: a branch with a pull request open gets one run through the pull request, not a
# second for the push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/live/captures/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/live/captures/**'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code, the build the type declarations are pinned to
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Fail when the installed build is not the one the pinned declarations came from
        run: tests/ci/declarations.sh
      - name: Validate the manifest and the hooks module
        run: claude plugin validate .
      - name: Fail when a hook runs a program not named for the host it runs on
        run: tests/ci/host-calls.sh
      - name: Run the mod's own commands on this system and read their answers as the mod does
        run: node --experimental-strip-types tests/ci/host-commands.mjs
      - name: Run the tests
        run: claude plugin test .
      - name: Type-check the hooks and the tests
        run: |
          npm install -g typescript@5.9.3
          tsc -p tests/ci/tsconfig.json --noEmit
      - name: Plant each known defect and expect the suite to fail
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/doctor/doctor.py
